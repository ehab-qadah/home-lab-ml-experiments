# Rendered by `python -m src.deploy` — do not edit the __PLACEHOLDER__ tokens by hand.
# Standard mode: no Knative, no scale-to-zero; the pod is always on (minReplicas 1).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: __NAME__
  namespace: __NAMESPACE__
  annotations:
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: __IMAGE__
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "src.predictor"]
        ports:
          - containerPort: 8080
            protocol: TCP
        env:
          - name: MODEL_DIR
            value: /mnt/models
          # the bundle is fetched at startup from SeaweedFS, so shipping a new model
          # means changing this URI — not rebuilding the image
          - name: MODEL_S3_URI
            value: __MODEL_S3_URI__
          - name: MODEL_NAME
            value: __NAME__
          - name: MLFLOW_S3_ENDPOINT_URL
            value: __S3_ENDPOINT__
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef: {name: s3-models-creds, key: access_key}
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef: {name: s3-models-creds, key: secret_key}
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: "2", memory: 2Gi}
        readinessProbe:
          httpGet: {path: /v2/health/ready, port: 8080}
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: {path: /v2/health/live, port: 8080}
          initialDelaySeconds: 30
          periodSeconds: 20
